name: CI/CD Frontend Tienda Perritos

on:
  push:
    branches:
      - main
    paths:
      - 'DevOps-FrontEnd/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v3

      - name: 2. Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 3. Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 4. Construir, etiquetar y subir imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tienda-frontend
          IMAGE_TAG: latest
        working-directory: ./DevOps-FrontEnd
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: 5. Desplegar en EC2 via AWS SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_FRONTEND_INSTANCE_ID }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" --comment "Despliegue automatizado de Frontend por GitHub Actions" --parameters commands=["aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY","sudo docker pull $ECR_REGISTRY/tienda-frontend:latest","sudo docker stop tienda-frontend || true","sudo docker rm tienda-frontend || true","sudo docker run -d --name tienda-frontend -p 80:80 $ECR_REGISTRY/tienda-frontend:latest"]
